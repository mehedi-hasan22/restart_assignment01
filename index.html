<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Lounch Pad</title>
</head>

<body class="font">
    <header class="header">
        <nav class="navbar">
            <div class="nav-content color logo">LoGo</div>
            <div class="nav-content"><button class="button">Sign Up</button></div>
        </nav>
        <section>
            <div class="nav-main">
                <h3 class="text main-text">Cool Dark UI Tamplates for <br> Webflow Agencies</h3>
                <button class="button">Stay Focused!</button>
            </div>
        </section>
    </header>
    <main>
        <section class="action-container">
            <div class="action">
                <h3 class="action-title text">See It In Action</h3>
                <p class="sub-text">Explore the live preview and imagine <br>your brand In a new Look!s</p>
                <button class="button">Launch Live Preview</button>
            </div>
            <div class="action">
                <img class="action-img" src="./images/wc-mini.png" alt="">
            </div>
        </section>
        <section class="users">
            <div class="user-info">
                <h3 class="text">Joined Thousands Of Productive Users</h3>
            </div>
            <div class="user-info">
                <div class="user">
                    <h3 class="user-title">50K</h3>
                    <p class="user-subtitle">Active Users</p>
                </div>
                <div class="user">
                    <h3 class="user-title">2M+</h3>
                    <p class="user-subtitle">Focus Sessions</p>
                </div>
                <div class="user">
                    <h3 class="user-title">95%</h3>
                    <p class="user-subtitle">Satisfaction Rate</p>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
